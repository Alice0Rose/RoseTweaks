l_french:
 ap_rose_eternal_vigilance_tt: "Unlocks the §Y$ap_eternal_vigilance$ Policies§! under §H$policy_category_military$§! which enable the automatic construction of §Y$military_station_small_plural$§! around owned §YStarbases§! every 6 months at the cost of §Y$mod_country_alloys_produces_mult$§!."
 
 # Starbase Coverage Policy
 policy_bev_eternal_vigilance_starbase_coverage_policy: "$ap_eternal_vigilance$ Coverage"
 policy_bev_eternal_vigilance_starbase_coverage_policy_desc: "Determines which Starbases, if any, should have $military_station_small_plural$ built around them every 6 months."
 bev_eternal_vigilance_starbase_coverage_policy_full: "Full Coverage"
 bev_eternal_vigilance_starbase_coverage_policy_full_name: "$bev_eternal_vigilance_starbase_coverage_policy_full$"
 bev_eternal_vigilance_starbase_coverage_policy_full_desc: "Every starbase needs to be properly defended. Spare no cost.\n\nAutomatically builds §Y$military_station_small_plural$§! around §YAll Starbases§!."
 bev_eternal_vigilance_starbase_coverage_policy_standard: "Standard Coverage"
 bev_eternal_vigilance_starbase_coverage_policy_standard_name: "$bev_eternal_vigilance_starbase_coverage_policy_standard$"
 bev_eternal_vigilance_starbase_coverage_policy_standard_desc: "If a starbase is worth outfitting with buildings and modules, it is worth defending.\n\nAutomatically builds §Y$military_station_small_plural$§! around §YUpgraded Starbases§!."
 bev_eternal_vigilance_starbase_coverage_policy_minimal: "Minimal Coverage"
 bev_eternal_vigilance_starbase_coverage_policy_minimal_name: "$bev_eternal_vigilance_starbase_coverage_policy_minimal$"
 bev_eternal_vigilance_starbase_coverage_policy_minimal_desc: "Only our strongest redoubts require our support.\n\nAutomatically builds §Y$military_station_small_plural$§! around §Y$sfortress$ Starbases§!."
 bev_eternal_vigilance_starbase_coverage_policy_no: "No Coverage"
 bev_eternal_vigilance_starbase_coverage_policy_no_name: "$bev_eternal_vigilance_starbase_coverage_policy_no$"
 bev_eternal_vigilance_starbase_coverage_policy_no_desc: "There is no need to further enhance our defenses.\n\nAutomatically builds §Y$military_station_small_plural$§! around §YNo Starbases§!."
 
 # Platform Density Policy
 policy_bev_eternal_vigilance_platform_density_policy: "$ap_eternal_vigilance$ Density"
 policy_bev_eternal_vigilance_platform_density_policy_desc: "Determines what percent of the $MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$ for each Starbase should be automatically built to."
 bev_eternal_vigilance_platform_density_policy_maximum: "Maximum Density"
 bev_eternal_vigilance_platform_density_policy_maximum_name: "$bev_eternal_vigilance_platform_density_policy_maximum$"
 bev_eternal_vigilance_platform_density_policy_maximum_desc: "An impenetrable shield ensures our survival now and forever.\n\nAutomatically builds up to §Y75%§! of §Y$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$§! at the cost of §R-10§! £alloys£ §Y$mod_country_alloys_produces_mult$§! per §YStarbase§! covered."
 bev_eternal_vigilance_platform_density_policy_moderate: "Moderate Density"
 bev_eternal_vigilance_platform_density_policy_moderate_name: "$bev_eternal_vigilance_platform_density_policy_moderate$"
 bev_eternal_vigilance_platform_density_policy_moderate_desc: "A defense need not be unbreakable so long as it is too costly to pierce.\n\nAutomatically builds up to §Y50%§! of §Y$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$§! at the cost of §R-5§! £alloys£ §Y$mod_country_alloys_produces_mult$§! per §YStarbase§! covered."
 bev_eternal_vigilance_platform_density_policy_minimum: "Minimum Density"
 bev_eternal_vigilance_platform_density_policy_minimum_name: "$bev_eternal_vigilance_platform_density_policy_minimum$"
 bev_eternal_vigilance_platform_density_policy_minimum_desc: "Frugality and defense need not be exclusive concepts.\n\nAutomatically builds up to §Y25%§! of §Y$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$§! at the cost of §R-2.5§! £alloys£ §Y$mod_country_alloys_produces_mult$§! per §YStarbase§! covered."
 
 # Modifiers
 bev_eternal_vigilance_platform_density_policy_maximum_modifier: "$ap_eternal_vigilance$ $bev_eternal_vigilance_platform_density_policy_maximum$"
 bev_eternal_vigilance_platform_density_policy_maximum_modifier_desc: "$bev_eternal_vigilance_platform_density_policy_maximum_desc$"
 bev_eternal_vigilance_platform_density_policy_moderate_modifier: "$ap_eternal_vigilance$ $bev_eternal_vigilance_platform_density_policy_moderate$"
 bev_eternal_vigilance_platform_density_policy_moderate_modifier_desc: "$bev_eternal_vigilance_platform_density_policy_moderate_desc$"
 bev_eternal_vigilance_platform_density_policy_minimum_modifier: "$ap_eternal_vigilance$ $bev_eternal_vigilance_platform_density_policy_minimum$"
 bev_eternal_vigilance_platform_density_policy_minimum_modifier_desc: "$bev_eternal_vigilance_platform_density_policy_minimum_desc$"