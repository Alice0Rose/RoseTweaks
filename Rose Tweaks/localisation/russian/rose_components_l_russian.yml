 ROSE_BOMBER_STRIKE_CRAFT: "Продвинутый бомбардировщик"
 ROSE_BOMBER_STRIKE_CRAFT_DESC: "Последние достижения в области самоуправляемых штурмовиков позволили создать новый тип кораблей, которые не обращают внимания на огонь вражеских истребителей, вместо этого целиком концентрируясь на более крупных кораблях."
 
