 # Synthetic Choice
 rose_synthetic_choice.1.name: "Облик нашего будущего"
 rose_synthetic_choice.1.desc: "По мере нашего приближения к возвышению граждане всё чаще задаются вопросом, как будут выглядеть наши новые роботизированные тела. Некоторые группы выступают за то, чтобы использовать это как возможность полностью изменить наш облик, в то время как другие настаивают на сохранении текущего вида с помощью синтетической кожи."
 rose_synthetic_choice.1.a: "Наши новые формы должны соответствовать нашим §Yтекущим§!."
 rose_synthetic_choice.1.b: "Мы должны соответствовать §Yсуществующему роботизированному§! населению."
 rose_synthetic_choice.1.c: "Это наш шанс стать чем-то §Yновым§!."
 
 rose_synthetic_choice.2.name: "Облик нашего будущего"
 rose_synthetic_choice.2.desc: "Прежде чем мы начнем процесс переноса наших оставшихся поселений в роботизированные тела, нам нужно решить, как эти тела будут выглядеть. Некоторые группы выступают за то, чтобы полностью изменить наш облик, в то время как другие настаивают на сохранении первоначального вида с помощью синтетической кожи в память о тех, кто погиб от болезни."
 rose_synthetic_choice.2.a: "Наши новые формы должны соответствовать нашим §Yоригинальным§! телам."
 rose_synthetic_choice.2.b: "Мы должны соответствовать §Yсуществующему роботизированному§! населению."
 rose_synthetic_choice.2.c: "Это наш шанс стать чем-то §Yновым§!."