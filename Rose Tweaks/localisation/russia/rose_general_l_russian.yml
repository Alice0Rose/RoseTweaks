 # Extra Mutual Aid Policies
 trade_policy_mutual_aid_minerals: "Взаимопомощь (Упор на минералы)"
 trade_conversion_mutual_aid_minerals_name: "$trade_policy_mutual_aid_minerals$"
 trade_policy_mutual_aid_minerals_desc: "Реинвестируя наши излишки обратно в кооператив, мы гарантируем, что все наши члены будут процветать в соответствии со своими потребностями и общими стремлениями.\n\n§Y75%§! от собранной нами $r_trade$ приносит нам $r_energy$, $r_minerals$ и $r_unity$. Каждая £trade£ §Y1§! ед. приносит нам £energy£ §Y0.4§!, £minerals£ §Y0.4§! и £unity£ §Y0.1§!."
 
 trade_policy_mutual_aid_food: "Взаимопомощь (Упор на пищу)"
 trade_conversion_mutual_aid_food_name: "$trade_policy_mutual_aid_food$" 
 trade_policy_mutual_aid_food_desc: "Реинвестируя наши излишки обратно в кооператив, мы гарантируем, что все наши члены будут процветать в соответствии со своими потребностями и общими стремлениями.\n\n§Y75%§! от собранной нами $r_trade$ приносит нам $r_energy$, $r_food$ и $r_unity$. Каждая £trade£ §Y1§! ед. приносит нам £energy£ §Y0.4§!, £food£ §Y0.4§! и £unity£ §Y0.1§!."
 
