 # Eternal Vigilance Policy
 ap_rose_eternal_vigilance_tt: "Каждые 9 месяцев вокруг каждой §Yзвездной базы§! будет строиться §Yоборонительная платформа§!, вплоть до максимума в §Y33%§! от вместимости, ценой определенного процента §Y$mod_country_alloys_produces_mult$§!."
 policy_rose_eternal_vigilance_policy: "$ap_eternal_vigilance$"
 policy_rose_eternal_vigilance_policy_desc: "Щит крепок лишь настолько, насколько крепок тот, кто его держит."
 rose_eternal_vigilance_policy_full_spending: "Полное финансирование платформ"
 rose_eternal_vigilance_policy_full_spending_name: "$eternal_vigilance_full_spending$"
 rose_eternal_vigilance_policy_full_spending_desc: "Каждая звездная база должна быть надежно защищена. Мы не постоим за ценой.\nАвтоматически строит §Yоборонительные платформы§! вокруг каждой §Yзвездной базы§!."
 rose_eternal_vigilance_policy_half_spending: "Частичное финансирование платформ"
 rose_eternal_vigilance_policy_half_spending_name: "$eternal_vigilance_half_spending$"
 rose_eternal_vigilance_policy_half_spending_desc: "Только самые мощные редуты требуют нашей поддержки.\nАвтоматически строит §Yоборонительные платформы§! вокруг §Yзвездных баз типа «Бастион»§!."
 rose_eternal_vigilance_policy_no_spending: "Без финансирования платформ"
 rose_eternal_vigilance_policy_no_spending_name: "$eternal_vigilance_no_spending$"
 rose_eternal_vigilance_policy_no_spending_desc: "Нет необходимости в дальнейшем усилении нашей обороны.\nАвтоматическое строительство §Yоборонительных платформ§! §Rотключено§! для всех §Yзвездных баз§!."
 
